allowBuilds:
  unrs-resolver: true
overrides:
  eslint-plugin-sonarjs>typescript: 6.0.3
  # fflate@0.8.3 breaks @arethetypeswrong streaming Gunzip (attw test:attw).
  fflate: 0.8.2
  # Cap at 1.x: ">=1.1.13" alone can resolve to brace-expansion@5, which breaks minimatch@3 (ESLint).
  brace-expansion@<1.1.13: '>=1.1.13 <2.0.0'
  brace-expansion@>=1.0.0 <=1.1.11: '>=1.1.12 <2.0.0'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
  brace-expansion@>=2.0.0 <=2.0.1: '>=2.0.2'
  brace-expansion@>=5.0.0 <5.0.9: '>=5.0.9'
  ajv>fast-uri: '>=4.1.2 <5.0.0'
  fast-uri@>=3.0.0 <=3.1.3: '>=3.1.4'
  fast-uri@>=4.0.0 <4.1.2: '>=4.1.2'
  diff@>=4.0.0 <4.0.4: '>=4.0.4'
  flatted@<3.4.0: '>=3.4.0'
  flatted@<=3.4.1: '>=3.4.2'
  js-yaml@<3.14.2: '>=3.14.2'
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1 <5.0.0'
  minimatch@<3.1.3: '>=3.1.3'
  minimatch@<3.1.4: '>=3.1.4'
  minimatch@>=9.0.0 <9.0.6: '>=9.0.6'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  nanoid@<3.3.18: '>=3.3.18 <4.0.0'
  picomatch@<2.3.2: '>=2.3.2'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  postcss@<=8.5.22: '>=8.5.23'
