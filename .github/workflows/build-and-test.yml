name: Build and test

on:
    push:
        branches: ["master"]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
        steps:
            - uses: actions/checkout@v7
            - run: corepack enable
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm test
